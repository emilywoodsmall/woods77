  for (let m = yMin; m <= yMax; m += yStep) g += `<line x1="${left}" x2="${W - 20}" y1="${y(m)}" y2="${y(m)}" stroke="var(--light)"/><text x="${left - 8}" y="${y(m) + 4}" text-anchor="end">${m > 0 ? "+" + m : m}</text>`;
  g += `<rect x="${left}" y="${top}" width="${W - left - 20}" height="${h}" fill="none" stroke="var(--line)"/>`;
  g += `<line x1="${left}" x2="${W - 20}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink)" stroke-width="1.5"/>`;
  g += `<text x="14" y="${top + h / 2}" transform="rotate(-90 14 ${top + h / 2})" text-anchor="middle">Minutes after required time</text>`;
  g += `<text x="${left + (W - left - 20) / 2}" y="${H - 6}" text-anchor="middle">Required leave time</text>`;
  rows.forEach((r) => {
    if (r[5] == null) return;
    g += `<circle cx="${x(r[4]).toFixed(1)}" cy="${y(r[5] / 60).toFixed(1)}" r="2.4" fill="var(--dot)"><title>${D.dates[r[0]]}, ${esc(route.timepoints[r[2]])}: required ${clock(r[4])}, left ${clock(r[4] + r[5])} (${diff(r[5])} min)</title></circle>`;
  });
  $("chart").innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutes after required leave time for each departure">${g}</svg>`;
}

function table(rows, route) {
  const multi = D.dates.length > 1;
  const sorted = [...rows].sort((a, b) => a[0] - b[0] || D.trips[a[3]][1] - D.trips[b[3]][1] || a[4] - b[4]);
  let t = `<table><thead><tr>${multi ? "<th>Date</th>" : ""}<th>Trip start</th><th>Timepoint</th><th>Required leave</th><th>Actual leave</th><th class="num">Difference (min)</th></tr></thead><tbody>`;
  sorted.forEach((r) => {
    t += `<tr>${multi ? `<td>${D.dates[r[0]]}</td>` : ""}<td>${clock(D.trips[r[3]][1])}</td><td>${esc(route.timepoints[r[2]])}</td><td>${clock(r[4])}</td>` +
      `<td>${r[5] == null ? "no data" : clock(r[4] + r[5])}</td><td class="num">${diff(r[5])}</td></tr>`;
  });
  $("table").innerHTML = t + "</tbody></table>";
}

function show(i) {
  current = i;
  const route = D.routes[i];
  const rows = D.rows.filter((r) => r[1] === i);
  $("route").value = i;
  $("prev").disabled = i === 0;
  $("next").disabled = i === D.routes.length - 1;
  $("chart-title").textContent = `Route ${route.short}: required vs. actual leave times`;
  $("table-title").textContent = `Route ${route.short}: all departures (${rows.length})`;
  chart(rows, route);
  table(rows, route);
}

$("title").textContent = `${D.feed_id.toUpperCase()} Timepoint Leave Times`;
$("sub").textContent = (D.start === D.end ? `Service day ${D.start}` : `Service days ${D.start} to ${D.end}`) + `. Times in ${D.timezone}, rounded to the nearest minute.`;
if (!D.routes.length) {
  $("sub").textContent += " No timepoint departures in this period.";
} else {
  $("route").innerHTML = D.routes.map((r, i) => `<option value="${i}">Route ${i + 1} of ${D.routes.length}: ${esc(routeLabel(r))}</option>`).join("");
  $("route").onchange = (e) => show(+e.target.value);
  $("prev").onclick = () => show(Math.max(0, current - 1));
  $("next").onclick = () => show(Math.min(D.routes.length - 1, current + 1));
  show(0);
}
</script>
</body>
</html>
